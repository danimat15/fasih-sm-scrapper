name: Process Scraped Data

on:
  push:
    branches:
      - main
    paths:
      - 'scraped_data.csv'
      - 'dashboard_scraped_data.csv'
      - 'data/**'
      - 'update_data.csv'
      - 'process_data.py'
      - 'generate_reports.py'

jobs:
  process-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Run Data Processing and Report Generation
        run: |
          python process_data.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-process scraped data and update reports" && git push)
